<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2012 iPad class project</title>
  <link rel="icon" href="sprites/darksquare.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="fit">
    <div id="device">
      <div id="statusbar"></div>
      <div id="screen">
        <div id="board"></div>
        <div id="blue-label" class="hud-label">Blue Controls:</div>
        <div id="red-label" class="hud-label right">Red Controls:</div>
        <div id="console">Setup Phase</div>
        <div id="moves-label" class="hud-label">Moves:</div>
        <div id="move-number" class="hud-label">1</div>
        <button type="button" id="blue-state">Start Game</button>
        <button type="button" id="red-state">Start Game</button>
        <button type="button" id="blue-turn">Change Turn</button>
        <button type="button" id="red-turn">Change Turn</button>
      </div>
    </div>
  </div>
  <footer>Web recreation of a 2012 iPad class project, using the original sprites</footer>
  <noscript>This page needs JavaScript to play. It does not load anything from the network.</noscript>
  <script src="game.js"></script>
</body>
</html>
